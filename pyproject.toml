[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiagentsallthethings"
version = "0.1.0"
description = "Security workbench for testing AI agents across text, voice, sensor, image, and device inputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0,<3"]
workbench = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "paho-mqtt>=2.0,<3",
    "websockets>=13,<15",
    "Pillow>=10,<12",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.27,<1",
]

[project.scripts]
aat = "harness.cli:main"
aat-workbench-api = "harness.api.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
# Ship the declarative test YAMLs so the CLI works from a non-editable install too.
harness = ["tests/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
